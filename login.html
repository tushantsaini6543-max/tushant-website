<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Tushant Academy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

    <div class="logo">
        🎓 TUSHANT ACADEMY
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="course.html">Learning</a>
        <a href="quiz.html">Quiz</a>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🎓
        </div>

        <h1>Welcome Back</h1>

        <p>
            Login to continue learning.
        </p>


        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <p
            id="loginMessage"
            class="auth-message">
        </p>


        <div class="auth-divider">
            OR
        </div>


        <p>
            Don't have an account?
        </p>

        <a
            href="signup.html"
            class="auth-link">

            Create Account

        </a>

    </div>

</main>


<script src="login.js"></script>

</body>

</html>
