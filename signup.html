<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Tushant Academy</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav>

    <div class="logo">
        🎓 TUSHANT ACADEMY
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🚀
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Start your learning journey.
        </p>


        <form id="signupForm">

            <label>
                Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="auth-button">

                Create Account

            </button>

        </form>


        <p
            id="signupMessage"
            class="auth-message">
        </p>


        <p>
            Already have an account?
        </p>

        <a
            href="login.html"
            class="auth-link">

            Login

        </a>

    </div>

</main>


<script>

const signupForm =
document.getElementById("signupForm");


signupForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
        document.getElementById(
            "signupName"
        ).value.trim();


        const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();


        const password =
        document.getElementById(
            "signupPassword"
        ).value;


        const message =
        document.getElementById(
            "signupMessage"
        );


        const user = {

            name: name,

            email: email,

            password: password

        };


        localStorage.setItem(
            "tushantUser",
            JSON.stringify(user)
        );


        message.textContent =
        "✅ Account created successfully!";


        setTimeout(
            function() {

                window.location.href =
                "login.html";

            },
            1000
        );

    }
);

</script>

</body>

</html>
